lín</tspan><tspan x="1280.0" dy="22">OSPF ID: 3.3.3.3</tspan><tspan x="1280.0" dy="22">V10: 192.168.7.97/28</tspan><tspan x="1280.0" dy="22">V20: 192.168.7.1/26</tspan><tspan x="1280.0" dy="22">V30: 192.168.6.129/25</tspan></text><rect x="620" y="540" width="300" height="130" rx="12" fill="#d1fae5" stroke="#64748b" /><text text-anchor="middle" font-family="Arial, sans-serif" font-size="14" x="770.0" y="588.0" fill="#172033"><tspan x="770.0" dy="0">SW_BOG | Capa 2</tspan><tspan x="770.0" dy="22">Gestión: VLAN 10</tspan><tspan x="770.0" dy="22">IP de gestión: por confirmar</tspan></text><rect x="100" y="850" width="300" height="130" rx="12" fill="#d1fae5" stroke="#64748b" /><text text-anchor="middle" font-family="Arial, sans-serif" font-size="14" x="250.0" y="898.0" fill="#172033"><tspan x="250.0" dy="0">SW_CALI | Capa 2</tspan><tspan x="250.0" dy="22">SVI: 192.168.7.66/27</tspan><tspan x="250.0" dy="22">Gateway: 192.168.7.65</tspan></text><rect x="1130" y="850" width="300" height="130" rx="12" fill="#d1fae5" stroke="#64748b" /><text text-anchor="middle" font-family="Arial, sans-serif" font-size="14" x="1280.0" y="898.0" fill="#172033"><tspan x="1280.0" dy="0">SW_MED | Capa 2</tspan><tspan x="1280.0" dy="22">SVI: 192.168.7.98/28</tspan><tspan x="1280.0" dy="22">Gateway: 192.168.7.97</tspan></text><rect x="620" y="850" width="300" height="130" rx="12" fill="#fef3c7" stroke="#64748b" /><text text-anchor="middle" font-family="Arial, sans-serif" font-size="14" x="770.0" y="876.0" fill="#172033"><tspan x="770.0" dy="0">Servidor Ubuntu | VLAN 10</tspan><tspan x="770.0" dy="22">ens37: 192.168.6.10/25</tspan><tspan x="770.0" dy="22">ens33: DHCP / NAT VMware</tspan><tspan x="770.0" dy="22">Nagios, Prometheus, Grafana</tspan><tspan x="770.0" dy="22">Node/SNMP Exporter, GLPI</tspan></text><rect x="620" y="1110" width="300" height="130" rx="12" fill="#e2e8f0" stroke="#64748b" /><text text-anchor="middle" font-family="Arial, sans-serif" font-size="14" x="770.0" y="1158.0" fill="#172033"><tspan x="770.0" dy="0">NAT VMware / Internet</tspan><tspan x="770.0" dy="22">Acceso por ens33</tspan><tspan x="770.0" dy="22">Gateway registrado: 172.16.154.2</tspan></text><rect x="595" y="1370" width="350" height="150" rx="12" fill="#ede9fe" stroke="#64748b" /><text text-anchor="middle" font-family="Arial, sans-serif" font-size="14" x="770.0" y="1406.0" fill="#172033"><tspan x="770.0" dy="0">BOGOTÁ | VLAN y puertas de enlace</tspan><tspan x="770.0" dy="22">10 ADMIN: 192.168.6.0/25 | VIP .6.1</tspan><tspan x="770.0" dy="22">20 SOPORTE: 192.168.4.0/24 | VIP .4.1</tspan><tspan x="770.0" dy="22">30 VENTAS: 192.168.0.0/23 | VIP .0.1</tspan><tspan x="770.0" dy="22">DHCP: BOG_R1 | Clientes por validar</tspan></text><rect x="75" y="1370" width="350" height="150" rx="12" fill="#ede9fe" stroke="#64748b" /><text text-anchor="middle" font-family="Arial, sans-serif" font-size="14" x="250.0" y="1406.0" fill="#172033"><tspan x="250.0" dy="0">CALI | VLAN y puertas de enlace</tspan><tspan x="250.0" dy="22">10 ADMIN: 192.168.7.64/27 | GW .7.65</tspan><tspan x="250.0" dy="22">20 SOPORTE: 192.168.5.0/24 | GW .5.1</tspan><tspan x="250.0" dy="22">30 VENTAS: 192.168.2.0/23 | GW .2.1</tspan><tspan x="250.0" dy="22">DHCP: CALI_R2 | Clientes por validar</tspan></text><rect x="1105" y="1370" width="350" height="150" rx="12" fill="#ede9fe" stroke="#64748b" /><text text-anchor="middle" font-family="Arial, sans-serif" font-size="14" x="1280.0" y="1406.0" fill="#172033"><tspan x="1280.0" dy="0">MEDELLÍN | VLAN y puertas de enlace</tspan><tspan x="1280.0" dy="22">10 ADMIN: 192.168.7.96/28 | GW .7.97</tspan><tspan x="1280.0" dy="22">20 SOPORTE: 192.168.7.0/26 | GW .7.1</tspan><tspan x="1280.0" dy="22">30 VENTAS: 192.168.6.128/25 | GW .6.129</tspan><tspan x="1280.0" dy="22">DHCP: MED_R4 | Clientes por validar</tspan></text><text text-anchor="middle" font-family="Arial, sans-serif" font-size="15" x="825" y="1610" fill="#172033"><tspan x="825" dy="0">Topología lógica basada en el estado compartido; no representa disponibilidad en tiempo real.</tspan><tspan x="825" dy="22">HSRP en Bogotá: principal y respaldo comparten SW_BOG. No hay salida WAN independiente del respaldo.</tspan><tspan x="825" dy="22">Monitoreo SNMP/ICMP por la red existente; no se dibujan enlaces físicos adicionales de monitoreo.</tspan><tspan x="825" dy="22">Un switch por sede. VLAN 99 eliminada. Troncales 802.1Q: VLAN 10, 20 y 30.</tspan><tspan x="825" dy="22">Los bloques VLAN son agrupaciones lógicas, no equipos. GW/VIP abreviadas conservan el prefijo 192.168.</tspan></text></svg>